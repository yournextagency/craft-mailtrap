name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Craft ${{ matrix.craft }} ${{ matrix.deps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest environment the plugin claims to support: oldest PHP, oldest Craft and
          # the oldest dependency set those allow — Symfony Mailer 6.0 and Mime 5.4.
          - { php: '8.0', craft: '^4.0', deps: '--prefer-lowest' }
          - { php: '8.0', craft: '^4.0' }
          - { php: '8.1', craft: '^4.0' }
          - { php: '8.2', craft: '^4.0' }
          - { php: '8.2', craft: '^5.0' }
          - { php: '8.3', craft: '^4.0' }
          - { php: '8.3', craft: '^5.0' }
          - { php: '8.4', craft: '^5.0' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Craft 4 pins twig/twig ~3.19.0, and the only release in that range carries security
      # advisories, so Composer 2.10 refuses to install it from scratch. That is Craft's own
      # dependency, not ours: without this the Craft 4 legs never reach our code. The setting
      # itself only exists in Composer 2.10 and later, which is what setup-php installs.
      - name: Allow Craft 4's pinned Twig
        if: startsWith(matrix.craft, '^4')
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist ${{ matrix.deps }} --with craftcms/cms:${{ matrix.craft }}

      - name: Run tests
        run: composer test

  analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run PHPStan
        run: composer phpstan
